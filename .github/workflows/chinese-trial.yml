name: Chinese trial for macOS

on:
  push:
    branches: [codex/zh-hans]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chinese-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.edition }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Intel
            runner: macos-26-intel
            arch: x86_64
            artifact: Orbit-Chinese-Intel
          - edition: Apple Silicon
            runner: macos-26
            arch: arm64
            artifact: Orbit-Chinese-Apple-Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check settings search and bundle metadata
        run: |
          python3 tools/regressions/settings-index-tests.py
          python3 tools/regressions/check-metadata.py
      - name: Build and package the Chinese trial
        env:
          ORBIT_TRIAL_ARCH: ${{ matrix.arch }}
          ORBIT_TRIAL_ARCHIVE: dist/${{ matrix.artifact }}.zip
        run: bash tools/build-chinese-trial.sh "$ORBIT_TRIAL_ARCHIVE"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
